version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tracker_db
    ports:
      - "5445:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: